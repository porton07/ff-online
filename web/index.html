<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feeding Frenzy Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ocean-bg">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>
  </div>

  <div id="app">
    <main class="stage-wrap">
      <canvas id="game-canvas" width="800" height="600"></canvas>

      <div class="floating-controls">
        <button id="btn-mute" class="glass-btn" title="Toggle Sound">🔊</button>
        <button id="btn-pause" class="glass-btn" title="Pause (Esc)">⏸</button>
        <button id="btn-menu" class="glass-btn" title="Main Menu">🏠</button>
      </div>

      <div id="buff-bar" class="buff-bar"></div>
      <div id="stage-banner" class="stage-banner"></div>

      <!-- Title Overlay -->
      <div id="overlay-title" class="overlay active">
        <div class="menu-shell">
          <div class="hero-section">
            <h1 class="game-logo">FEEDING FRENZY</h1>
            <p class="hero-sub">40 Stages • 5 Playable Fish • Online Co-Op</p>
          </div>

          <div class="menu-columns">
            <!-- Section 1: Solo & Co-Op -->
            <div class="menu-card">
              <div class="section-title">🎮 SOLO PLAY</div>
              <div class="solo-actions">
                <button id="btn-play-story" class="btn-gold">
                  <span class="btn-main">▶ Story Mode</span>
                  <span class="btn-desc">Start from Stage 1 as Andy</span>
                </button>
                <button id="btn-play-timed" class="btn-aqua">
                  <span class="btn-main">⏱ Time Attack</span>
                  <span class="btn-desc">Beat the clock for high score</span>
                </button>
              </div>

              <div class="divider"></div>

              <div class="section-title">🌐 ONLINE CO-OP (2–4 PLAYERS)</div>
              <div class="coop-panel">
                <button id="btn-coop-create" class="btn-teal">Create Room</button>
                <div class="coop-join">
                  <input id="coop-code-input" type="text" maxlength="4" placeholder="CODE" />
                  <button id="btn-coop-join" class="btn-aqua-sm">Join</button>
                </div>
              </div>
              <div id="coop-lobby" class="coop-lobby" hidden>
                <span id="coop-status"></span>
                <button id="btn-coop-start" class="btn-gold-sm" hidden>▶ Start Co-Op</button>
              </div>
            </div>

            <!-- Section 2: Stage Select by Character -->
            <div class="menu-card">
              <div class="section-title">🗺 STAGE SELECT</div>
              <div id="char-tabs" class="char-tabs"></div>
              <div id="stage-grid" class="stage-grid"></div>
            </div>
          </div>

          <div class="controls-footer">
            <span><b>Mouse</b> / <b>WASD</b> Swim</span>
            <span><b>Click</b> / <b>Space</b> Dash</span>
            <span><b>Right-Click</b> / <b>E</b> JD Suction</span>
            <span><b>Esc</b> Pause</span>
          </div>
        </div>
      </div>

      <!-- Pause Overlay -->
      <div id="overlay-pause" class="overlay">
        <div class="modal small-modal">
          <h2>PAUSED</h2>
          <div class="btn-col">
            <button id="btn-resume" class="btn-gold">▶ Resume</button>
            <button id="btn-restart-stage" class="btn-aqua">↻ Restart Stage</button>
            <button id="btn-quit-menu" class="btn-teal">🏠 Main Menu</button>
          </div>
        </div>
      </div>

      <!-- Stage Clear Overlay -->
      <div id="overlay-clear" class="overlay">
        <div class="modal small-modal">
          <h2>STAGE CLEAR!</h2>
          <p id="clear-summary" class="modal-summary"></p>
          <button id="btn-next-stage" class="btn-gold">Next Stage ▶</button>
        </div>
      </div>

      <!-- Game Over / Won Overlay -->
      <div id="overlay-gameover" class="overlay">
        <div class="modal small-modal">
          <h2 id="gameover-title">GAME OVER</h2>
          <p id="gameover-summary" class="modal-summary"></p>
          <div class="btn-col">
            <button id="btn-retry" class="btn-gold">↻ Try Again</button>
            <button id="btn-go-menu" class="btn-teal">🏠 Main Menu</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
