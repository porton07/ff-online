<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feeding Frenzy Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ocean-bg">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>
  </div>

  <div id="app">
    <main class="stage-wrap">
      <canvas id="game-canvas" width="800" height="600"></canvas>

      <div class="floating-controls">
        <button id="btn-mute" class="glass-btn" title="Toggle Sound">
          <svg id="icon-sound-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <svg id="icon-sound-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <button id="btn-pause" class="glass-btn" title="Pause (Esc)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <button id="btn-menu" class="glass-btn" title="Main Menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
      </div>

      <div id="buff-bar" class="buff-bar"></div>
      <div id="stage-banner" class="stage-banner"></div>

      <!-- Title Overlay (Authentic Main Menu) -->
      <div id="overlay-title" class="overlay active orig-menu-overlay">
        <div class="orig-menu-stage">
          <img class="orig-bg" src="assets/resources/menus/mainbg.jpg" alt="Main Menu" />
          <img class="orig-logo" src="assets/resources/menus/logo.png" alt="Feeding Frenzy" />

          <button id="btn-play-story" class="orig-img-btn btn-new-game" title="Story Mode (Map)"></button>
          <button id="btn-play-timed" class="orig-img-btn btn-time-game" title="Time Attack"></button>

          <div class="orig-helper orig-helper-story">
            Explore the ocean &amp; eat your way to the top of the food chain!
          </div>
          <div class="orig-helper orig-helper-time">
            See how far you can last before the Time Attack Clock runs out!
          </div>

          <div class="orig-coop-bar">
            <span class="orig-coop-title">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              ONLINE CO-OP (2–4P)
            </span>
            <button id="btn-coop-create" class="btn-teal">Create Room</button>
            <div class="coop-join">
              <input id="coop-code-input" type="text" maxlength="4" placeholder="CODE" />
              <button id="btn-coop-join" class="btn-aqua-sm">Join</button>
            </div>
            <div id="coop-lobby" class="coop-lobby" hidden>
              <span id="coop-status"></span>
              <button id="btn-coop-start" class="btn-gold-sm" hidden>
                <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Choose Stage on Map
              </button>
            </div>
          </div>

          <div class="orig-controls-hint">
            <b>Mouse / WASD</b> Swim • <b>Click / Space</b> Dash • <b>RMB / E</b> JD Suction • <b>Esc</b> Pause
          </div>
        </div>
      </div>

      <!-- Story Mode Map Overlay (Authentic Map Layout) -->
      <div id="overlay-map" class="overlay map-overlay">
        <div class="map-container">
          <img class="map-bg" src="assets/resources/menus/mapBg.jpg" alt="Ocean Map" />
          <img class="orig-logo" src="assets/resources/menus/logo.png" alt="Feeding Frenzy" />

          <button class="orig-region-btn reg-andy" data-char="Andy" title="Andy (Stages 1–8)"></button>
          <button class="orig-region-btn reg-leon" data-char="Leon" title="Leon (Stages 9–16)"></button>
          <button class="orig-region-btn reg-eddie" data-char="Eddie" title="Eddie (Stages 17–24)"></button>
          <button class="orig-region-btn reg-jd" data-char="JD" title="JD (Stages 25–32)"></button>
          <button class="orig-region-btn reg-orville" data-char="Orville" title="Orville (Stages 33–40)"></button>

          <svg id="map-trail" class="map-trail" viewBox="0 0 640 480" preserveAspectRatio="none"></svg>
          <div id="map-nodes" class="map-nodes"></div>

          <div id="map-hover-info" class="orig-map-label">Click any pearl on the map to start!</div>
          <button id="btn-map-back" class="orig-back-btn">Back to Menu</button>
        </div>
      </div>

      <!-- Pause Overlay -->
      <div id="overlay-pause" class="overlay">
        <div class="modal small-modal">
          <h2>PAUSED</h2>
          <div class="btn-col">
            <button id="btn-resume" class="btn-gold">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Resume
            </button>
            <button id="btn-restart-stage" class="btn-aqua">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              Restart Stage
            </button>
            <button id="btn-quit-menu" class="btn-teal">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Main Menu
            </button>
          </div>
        </div>
      </div>

      <!-- Stage Clear Overlay -->
      <div id="overlay-clear" class="overlay">
        <div class="modal small-modal">
          <h2>STAGE CLEAR!</h2>
          <p id="clear-summary" class="modal-summary"></p>
          <button id="btn-next-stage" class="btn-gold">
            Next Stage
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
        </div>
      </div>

      <!-- Game Over / Won Overlay -->
      <div id="overlay-gameover" class="overlay">
        <div class="modal small-modal">
          <h2 id="gameover-title">GAME OVER</h2>
          <p id="gameover-summary" class="modal-summary"></p>
          <div class="btn-col">
            <button id="btn-retry" class="btn-gold">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              Try Again
            </button>
            <button id="btn-go-menu" class="btn-teal">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Main Menu
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
